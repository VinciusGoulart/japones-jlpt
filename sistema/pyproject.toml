[project]
name = "japones-sistema"
version = "0.1.0"
description = "Núcleo do sistema de estudo de japonês: estudo.db, fontes (Anki, Trello, Kotoba) e servidor MCP do tutor"
requires-python = ">=3.13"
dependencies = [
  "mcp>=2.3,<3",          # 2.x: a classe é MCPServer (na 1.x era FastMCP)
  "fastapi>=0.143",       # API do painel (Fase 2)
  "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
